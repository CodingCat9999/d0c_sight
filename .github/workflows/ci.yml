name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: 의존성 설치 (lock 고정)
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

      # 테스트 0개는 실패다. tests/conftest.py 의 훅이 1차로 막고,
      # 여기서 exit code 5(no tests collected)를 2차로 막는다.
      # 한 층이 무너져도 초록으로 남지 않게 한다(BRIEF §6.3).
      - name: pytest
        run: |
          set +e
          uv run pytest -ra
          code=$?
          set -e
          if [ "$code" -eq 5 ]; then
            echo "::error::테스트가 하나도 수집되지 않았다. 0개 통과는 통과가 아니라 미실행이다."
            exit 1
          fi
          exit "$code"
